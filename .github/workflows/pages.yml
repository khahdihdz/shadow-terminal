name: Shadow Terminal — Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages
        run: |
          set -e
          test -f docs/index.html
          test -f docs/style.css
          test -f docs/og-image.svg
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          convert -background none docs/og-image.svg -resize 1200x630^ -gravity center -extent 1200x630 docs/og-image.png
          file docs/og-image.png
          echo "Deploying commit: $GITHUB_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
